services:
  - type: web
    name: newspulse
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: newspulse-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PYTHON_PATH
        value: python3
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: newspulse-db
